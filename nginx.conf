server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mock /api/config so the UI renders with a placeholder group
    location = /api/config {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"port":7544,"groups":[{"name":"Preview Mode","apiServerIp":"0.0.0.0"}]}';
    }

    # All other /api/* calls return a clear error (no real Xeebra in preview)
    location /api/ {
        default_type application/json;
        return 502 '{"error":"API not available in preview mode — connect a real xeebra-ctrl instance"}';
    }

    # SPA fallback — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
