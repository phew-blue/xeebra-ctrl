name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # TypeScript type check — fast feedback on PRs
  # ──────────────────────────────────────────────────────────────────
  check-types:
    name: Type check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm build
        working-directory: frontend

  # ──────────────────────────────────────────────────────────────────
  # Container image build — validation only, never pushed.
  # The Dev workflow pushes this image on merge to main; without this job
  # nothing exercises the Dockerfile on a PR, so a broken build only surfaces
  # after it has already landed.
  # ──────────────────────────────────────────────────────────────────
  build-image:
    name: Build container image
    needs: check-types
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=xeebra-ctrl
          cache-to: type=gha,mode=max,scope=xeebra-ctrl

  # ──────────────────────────────────────────────────────────────────
  # Full build — frontend + Go binary + (on tags) Inno Setup installer
  # Runs on Windows so CGO syscall dependencies compile natively.
  # GitHub-hosted windows-latest by default; set the WINDOWS_RUNNER variable to
  # target a self-hosted pool (e.g. DT-02). Inno Setup is installed via choco below.
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: check-types
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Build React frontend (produces frontend/dist — required by go:embed)
      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend

      # Resolved for every ref: a tag build stamps its version into the binary so
      # self-update can compare against the manifest; anything else stays "dev",
      # which never self-updates.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "stamp=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "stamp=dev" >> $GITHUB_OUTPUT
          fi

      # Build Go binary (embeds frontend/dist)
      - name: Build Go binary
        run: go build -ldflags="-s -w -H windowsgui -X main.version=${{ steps.version.outputs.stamp }}" -o xeebra-ctrl.exe .

      # ── Installer: compiled on every ref, published on tags only ────

      # The .iss carries Pascal Script whose errors only surface at compile
      # time. Two such defects shipped in v0.3.0 while this ran tag-only.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\windows\xeebra-ctrl.iss

      # ── Tag-only steps below ────────────────────────────────────────

      # The tray's self-update reads this from the latest release. It advertises
      # the setup asset with its SHA256; an installer that fails verification is
      # never run, so the hash has to describe the exact file uploaded below.
      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver   = "${{ steps.version.outputs.version }}"
          $tag   = "${{ steps.version.outputs.stamp }}"
          $setup = "installer/windows/Output/xeebra-ctrl-setup-$ver.exe"
          if (-not (Test-Path $setup)) { throw "installer not found at $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $setup).Length
          $manifest = [ordered]@{
            schema = 1
            latest = [ordered]@{
              version = $tag
              setup   = [ordered]@{
                url    = "https://github.com/${{ github.repository }}/releases/download/$tag/xeebra-ctrl-setup-$ver.exe"
                sha256 = $hash
                size   = $size
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path manifest.json -Encoding utf8
          Get-Content manifest.json

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            installer/windows/Output/xeebra-ctrl-setup-*.exe
            manifest.json
