name: DT-02 Windows Runner Test

# One-off / on-demand check that the self-hosted Windows runner pool
# (home-ops-windows — currently DT-02) can natively build the xeebra-ctrl
# Windows artifact: React frontend -> embedded Go binary -> Inno Setup installer.
# Mirrors the dev.yml `installer` job but targets the self-hosted pool instead
# of GitHub-hosted windows-latest. Safe to delete once validated.
on:
  pull_request:
    paths:
      - .github/workflows/dt-02-test.yml
  workflow_dispatch:

jobs:
  build-on-dt-02:
    name: Build on self-hosted Windows
    runs-on: home-ops-windows
    permissions:
      contents: read
    steps:
      - name: Runner identity
        shell: powershell
        run: |
          Write-Host "host   = $env:COMPUTERNAME"
          Write-Host "runner = $env:RUNNER_NAME"
          Write-Host "os     = $env:RUNNER_OS"
          Write-Host "whoami = $(whoami)"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: latest

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend

      - name: Build Go binary
        run: go build -ldflags="-s -w -H windowsgui" -o xeebra-ctrl.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          iscc "/DMyAppVersion=dt02-$shortSha" "installer\windows\xeebra-ctrl.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeebra-ctrl-dt02-installer
          path: installer/windows/Output/xeebra-ctrl-setup-*.exe
          retention-days: 7
