name: Dev

on:
  push:
    branches: [main]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/phew-blue/xeebra-ctrl

jobs:
  build:
    name: Build & push
    runs-on: home-ops
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=dev

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:dev
          cache-to: type=inline

  installer:
    name: Build dev installer
    runs-on: home-ops-windows
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: latest

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend

      - name: Build Go binary
        run: go build -ldflags="-s -w -H windowsgui" -o xeebra-ctrl.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          iscc "/DMyAppVersion=dev-$shortSha" "installer\windows\xeebra-ctrl.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeebra-ctrl-dev-installer
          path: installer/windows/Output/xeebra-ctrl-setup-*.exe
          retention-days: 14

  deploy:
    name: Update home-ops digest
    needs: build
    runs-on: home-ops
    steps:
      - name: Commit digest to home-ops
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/phew-blue/home-ops.git /tmp/home-ops
          cd /tmp/home-ops

          HELMRELEASE="kubernetes/apps/dev/xeebra-ctrl/app/helmrelease.yaml"

          sed -i "s|digest: \".*\"|digest: \"${DIGEST}\"|" "$HELMRELEASE"

          # Add digest line if not already present
          if ! grep -q "digest:" "$HELMRELEASE"; then
            sed -i "s|tag: dev|tag: dev\n              digest: \"${DIGEST}\"|" "$HELMRELEASE"
          fi

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$HELMRELEASE"
            git commit -m "chore(dev/xeebra-ctrl): pin image digest"
            git push
          fi
